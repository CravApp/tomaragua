name: Flutter iOS Build (IPA)

on:
  push:
    branches: [ "iOS" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # The fix: We pass build configurations to xcode-build via Flutter's --build-name/number 
      # and specifically define the CODE_SIGNING_ALLOWED=NO and other flags to bypass the Team ID check.
      - name: Build iOS app (Forced Unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --extra-gen-snapshot-options="--deterministic" \
            --build-number=1 \
            --build-name=1.0.0
        env:
          # This helps bypass some of the strict Xcode signing checks in CI
          PROVISIONING_PROFILE_SPECIFIER: ""
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_ENTITLEMENTS: ""
          CODE_SIGNING_METHOD: "manual"

      - name: Package into IPA
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          # Create the Payload directory which is the standard structure for an IPA
          mkdir Payload
          cp -r Runner.app Payload
          # Zip it up into an .ipa file
          zip -qq -r ../ipa/app-unsigned.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14
